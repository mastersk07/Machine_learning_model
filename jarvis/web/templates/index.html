<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="scene-container"></div>

  <div id="hud">
    <header id="hud-header">
      <div class="brand">J.A.R.V.I.S.</div>
      <div id="state-label">STANDBY</div>
    </header>

    <div id="transcript" aria-live="polite"></div>

    <footer id="input-bar">
      <button id="mic-btn" title="Voice input (browser Web Speech API)">🎙</button>
      <input id="text-input" type="text" placeholder="Speak or type to Jarvis..." autocomplete="off">
      <button id="send-btn">Send</button>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='vendor/three.min.js') }}"></script>
  <script src="{{ url_for('static', filename='hud.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
